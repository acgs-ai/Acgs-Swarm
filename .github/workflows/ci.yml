name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["dev"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[${{ matrix.extras }},transport]"
      - name: Lint
        run: ruff check src/constitutional_swarm/
      - name: Test
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e and not research and not bittensor" \
            -v --tb=short

  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # no-extras surface: this is the published-library distribution contract —
      # the package must type-check with no optional deps installed. Type errors
      # that only surface once an extra's real (py.typed) types resolve are NOT
      # visible here; the typecheck-transport job below covers that surface.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Type-check
        run: mypy

  typecheck-transport:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # transport surface: websockets ships py.typed, so installing it lets mypy
      # resolve the real types in transport-gated modules (e.g. gossip_protocol,
      # remote_vote_transport) that the no-extras job cannot see. This is where
      # env-sensitive type errors are caught — matching the local `make typecheck`
      # default (EXTRAS="dev transport").
      - name: Install
        run: pip install -e ".[dev,transport]"
      - name: Type-check
        run: mypy

  test-research:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install with research extras
        run: pip install -e ".[dev,research,transport]"
      - name: Test research stack
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e" \
            -v --tb=short

  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build --wheel --sdist
      - name: Validate
        run: twine check dist/*
      - name: Smoke test wheel install
        run: pip install dist/*.whl && python -c "import constitutional_swarm; print('import OK')"

  test-extras-bittensor:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install with bittensor extras
        run: |
          pip install -e ".[dev,bittensor]"
          pip uninstall scalecodec -y || true
          pip install cyscale --force-reinstall
      - name: Verify bittensor extras import
        run: python -c "from constitutional_swarm.bittensor.protocol import MinerConfig; print('bittensor extras OK')"

  test-extras-transport:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install with transport extras
        run: pip install -e ".[dev,transport]"
      - name: Verify transport extras import
        run: python -c "from constitutional_swarm.gossip_protocol import GossipNode; print('transport extras OK')"
