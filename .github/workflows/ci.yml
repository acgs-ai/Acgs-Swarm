name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Number of test-postgres shards; keep equal to the matrix length below.
  POSTGRES_TEST_SHARDS: "4"

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["dev"]
    steps:
      - uses: actions/checkout@v7
        with:
          # HistoricalGCBAdapter pins GCB-1 at 6e65db3 and git-archives it.
          # The default depth-1 checkout cannot rev-parse that ancestor.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[${{ matrix.extras }},transport]"
      - name: Lint
        run: ruff check src/constitutional_swarm/
      - name: Test
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          # Live PostgreSQL + psycopg live in test-postgres. Default jobs do not
          # install that extra; catalog tests import postgres_store (hard import).
          python -m pytest tests/ \
            --ignore=tests/test_apcc_postgres.py \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e and not research and not bittensor" \
            -v --tb=short

  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # no-extras surface: this is the published-library distribution contract —
      # the package must type-check with no optional deps installed. Type errors
      # that only surface once an extra's real (py.typed) types resolve are NOT
      # visible here; the typecheck-transport job below covers that surface.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Type-check
        run: mypy

  typecheck-transport:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # transport surface: websockets ships py.typed, so installing it lets mypy
      # resolve the real types in transport-gated modules (e.g. gossip_protocol,
      # remote_vote_transport) that the no-extras job cannot see. This is where
      # env-sensitive type errors are caught — matching the local `make typecheck`
      # default (EXTRAS="dev transport").
      - name: Install
        run: pip install -e ".[dev,transport]"
      - name: Type-check
        run: mypy

  # The PostgreSQL contract suite runs serially because its tests assert on
  # timing and lock ordering; pytest-xdist against one server would add CPU and
  # catalog contention to exactly those tests.  Instead the collection is split
  # into shards, each with its own runner and its own PostgreSQL 17 service.
  # scripts/ci_pytest_shard.py assigns every collected test to exactly one
  # shard, and the `test-postgres` job below fails unless the shards together
  # ran the whole collection with nothing skipped.  To change the shard count,
  # edit POSTGRES_TEST_SHARDS and the matrix together.
  test-postgres-shard:
    name: test-postgres-shard (${{ matrix.shard }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apcc_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: apcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apcc -d apcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APCC_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=apcc_test user=apcc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Configure PostgreSQL 17 contention capacity
        run: |
          service_id="${{ job.services.postgres.id }}"
          docker exec "$service_id" \
            psql -v ON_ERROR_STOP=1 -U apcc -d apcc_test \
            -c "ALTER SYSTEM SET max_connections = '200'"
          docker restart "$service_id"
          for attempt in {1..30}; do
            if docker exec "$service_id" pg_isready -U apcc -d apcc_test; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "PostgreSQL did not become ready after restart" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec "$service_id" psql -At -U apcc -d apcc_test \
            -c "SHOW server_version_num")" -ge 170000
          test "$(docker exec "$service_id" psql -At -U apcc -d apcc_test \
            -c "SHOW server_version_num")" -lt 180000
          test "$(docker exec "$service_id" psql -At -U apcc -d apcc_test \
            -c "SHOW max_connections")" -eq 200
      - name: Install with PostgreSQL support
        run: pip install -e ".[dev,postgres]"
      # Production postgres_store.py only. tests/test_apcc_postgres.py is in the
      # frozen B2 pair (its content hash is recorded in DECISIONS.md, not here);
      # its test-local Protocols omit
      # psycopg.errors / Cursor.rowcount and fail mypy 2.x attr-defined/misc.
      # Default [tool.mypy] files already exclude tests/; do not type-check the
      # frozen pair here.
      - name: Type-check PostgreSQL backend
        if: matrix.shard == 0
        run: mypy src/constitutional_swarm/apcc/postgres_store.py
      - name: Select this shard's tests
        run: |
          python scripts/ci_pytest_shard.py select \
            --shards "$POSTGRES_TEST_SHARDS" --index "${{ matrix.shard }}" \
            --out shard-args.txt \
            --manifest "shard-manifest-${{ matrix.shard }}.json" \
            --pytest-arg=--import-mode=importlib \
            tests/test_apcc_postgres.py tests/test_apcc_schema_v4_compat.py
      - name: Test PostgreSQL authority store without skips
        run: |
          python -m pytest -q @shard-args.txt \
            --import-mode=importlib --durations=15 \
            --junitxml="shard-results-${{ matrix.shard }}.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = f"shard-results-{os.environ['SHARD']}.xml"
          root = ET.parse(report).getroot()
          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for suite in root.iter("testsuite")
          )
          if skipped:
              raise SystemExit(f"PostgreSQL suite skipped {skipped} test(s)")
          PY
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-shard-${{ matrix.shard }}
          # "Re-run failed jobs" uploads the same name again; replace the
          # failed attempt's report instead of failing on the name conflict.
          overwrite: true
          path: |
            shard-manifest-${{ matrix.shard }}.json
            shard-results-${{ matrix.shard }}.xml
          if-no-files-found: error

  # Keeps the required check name `test-postgres`.  It passes only when every
  # shard succeeded and the shards provably covered the whole collection.
  test-postgres:
    needs: test-postgres-shard
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          pattern: postgres-shard-*
          path: postgres-shards
      - name: Require every shard to pass
        run: test "${{ needs.test-postgres-shard.result }}" = "success"
      - name: Prove the shards covered the whole collection without skips
        run: python scripts/ci_pytest_shard.py verify --shards "$POSTGRES_TEST_SHARDS" postgres-shards

  test-research:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with research extras
        run: pip install -e ".[dev,research,transport]"
      - name: Test research stack
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_apcc_postgres.py \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e" \
            -v --tb=short

  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build --wheel --sdist
      - name: Validate
        run: twine check dist/*
      - name: Smoke test wheel install
        run: pip install dist/*.whl && python -c "import constitutional_swarm; print('import OK')"

  test-extras-bittensor:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with bittensor extras
        run: |
          pip install -e ".[dev,bittensor]"
          pip uninstall scalecodec -y || true
          pip install cyscale --force-reinstall
      - name: Verify bittensor extras import
        run: python -c "from constitutional_swarm.bittensor.protocol import MinerConfig; print('bittensor extras OK')"

  test-extras-transport:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with transport extras
        run: pip install -e ".[dev,transport]"
      - name: Verify transport extras import
        run: python -c "from constitutional_swarm.gossip_protocol import GossipNode; print('transport extras OK')"
