name: Publish to PyPI

# Publishing ANY GitHub Release uploads to PyPI, including releases marked
# pre-release; a PyPI release can be yanked, but a filename can never be
# re-uploaded. A push to a release/** branch or a manual dispatch is a
# rehearsal: it runs ci and package (build, twine check, isolated wheel gate)
# and skips publish.
on:
  release:
    types: [published]
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every ci.yml job (pytest legs, typecheck, live PostgreSQL 17, research,
  # extras) on the exact release commit. ci.yml on push/PR to main never runs
  # on a commit tagged from a release branch. agent-check, tla-check, security
  # and verify-cites are not called here.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build --wheel --sdist
      - name: Validate
        run: twine check dist/*
      - name: Isolated wheel gate
        # Same checks as `make verify-wheel`, run against the wheel uploaded as
        # the artifact the publish job releases (not a rebuild).
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          test -f "$1"
          python scripts/verify_isolated_wheel.py --wheel "$1" --python "$(command -v python)"
      - name: Upload validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: validated-python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [ci, package]
    # Only a published Release uploads. Rehearsal triggers stop after package.
    if: github.event_name == 'release'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: validated-python-distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
