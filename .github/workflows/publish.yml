name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          # HistoricalGCBAdapter pins GCB-1 at 6e65db3 and git-archives it.
          # The default depth-1 checkout cannot rev-parse that ancestor.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,transport]"
      - name: Test
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          # Mirrors the 3.11 leg of the ci.yml `test` pytest step. Live PostgreSQL + psycopg are covered by the
          # ci.yml test-postgres job; this job does not install that extra.
          python -m pytest tests/ \
            --ignore=tests/test_apcc_postgres.py \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e and not research and not bittensor" \
            -v --tb=short

  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build --wheel --sdist
      - name: Validate
        run: twine check dist/*
      - name: Isolated wheel gate
        # Same checks as `make verify-wheel`, run against the wheel that is
        # uploaded and published (not a rebuild).
        run: |
          set -- dist/*.whl
          test "$#" -eq 1
          test -f "$1"
          python scripts/verify_isolated_wheel.py --wheel "$1" --python "$(command -v python)"
      - name: Upload validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: validated-python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [test, package]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: validated-python-distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
