name: verify-citations

on:
  pull_request:
    paths:
      - 'papers/**'
      - 'paper/**'
      - 'docs/**'
      - 'src/**/*.py'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
  schedule:
    # Weekly drift check — arXiv occasionally withdraws papers
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: cite-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Scan only (fast fail on parse errors)
        run: python scripts/verify_citations.py --root . --skip-network
      - name: Full network verification
        run: python scripts/verify_citations.py --root . --timeout 15 --workers 8
        # Allow one retry for transient arXiv rate limits
        continue-on-error: false
      - name: Upload JSON results
        if: always()
        run: |
          python scripts/verify_citations.py --root . --json > cites.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: citation-results
          path: cites.json
