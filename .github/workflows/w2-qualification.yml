name: W2 Qualification (Manual)

on:
  push:
    branches:
      - perf/b8-w2-qual-10k-rebased
      - perf/p3c-w2-10k-profile
  workflow_dispatch:
    inputs:
      scheduled_operations:
        description: "Scheduled W2 operations (multiple of 100, e.g. 10000)"
        required: true
        type: string
        default: "10000"
      duration_ns:
        description: "Window duration in nanoseconds (e.g. 1000000000000 for 1000s)"
        required: true
        type: string
        default: "1000000000000"
      admission_grace_ns:
        description: "Admission grace in nanoseconds (25ms = 25000000)"
        required: true
        type: string
        default: "25000000"
      operation_sla_ns:
        description: "Per-operation SLA in nanoseconds (200ms = 200000000)"
        required: true
        type: string
        default: "200000000"
      drain_ns:
        description: "Drain interval in nanoseconds (1000ms = 1000000000)"
        required: true
        type: string
        default: "1000000000"
      operation_floor:
        description: "Required on-time commit floor (e.g. 10000)"
        required: true
        type: string
        default: "10000"
      windows:
        description: "Number of consecutive W2 windows (1 cold, up to 3 warm)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
      allow_missing_upstream_provenance:
        description: "Allow opt-in recording of missing upstream experiments/apcc-1 v2/v3 specs in provenance"
        required: true
        type: boolean
        default: false
      host_probe_max_cpu_ms:
        description: "Host admission limit in ms CPU for the probe's fastest round (empty = use the committed value)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  w2-cold-cell:
    name: w2-cold-cell (gen2_gc=${{ matrix.gen2_gc }}, repeat=${{ matrix.repeat }})
    strategy:
      fail-fast: false
      matrix:
        # Same commit, separate runners: the two arms differ only in whether
        # the controller defers full garbage collections during the window.
        # Two repeats per arm, because one run per arm cannot separate the
        # change from run-to-run variance.
        gen2_gc: [default, deferred]
        repeat: ["1", "2"]
    uses: ./.github/workflows/w2-cell.yml
    with:
      gen2_gc: ${{ matrix.gen2_gc }}
      repeat: ${{ matrix.repeat }}
      # Host admission limit for scripts/w2_host_probe.py, in milliseconds of
      # CPU for the fastest probe round. The committed value is the literal
      # after "||". Empty means record only: no host is voided. It stays empty
      # until probe values from this runner class exist; see "Host admission"
      # in docs/internal/APCC-1-W2-Campaign-Protocol.md.
      host_probe_max_cpu_ms: ${{ inputs.host_probe_max_cpu_ms || '' }}
      diagnostics: ${{ vars.APCC_W2_DIAGNOSTICS || '1' }}
      allow_missing_upstream_provenance: ${{ (github.event_name == 'push' || inputs.allow_missing_upstream_provenance) && '1' || '0' }}
      scheduled_operations: ${{ inputs.scheduled_operations || '10000' }}
      duration_ns: ${{ inputs.duration_ns || '1000000000000' }}
      admission_grace_ns: ${{ inputs.admission_grace_ns || '25000000' }}
      operation_sla_ns: ${{ inputs.operation_sla_ns || '200000000' }}
      drain_ns: ${{ inputs.drain_ns || '1000000000' }}
      operation_floor: ${{ inputs.operation_floor || '10000' }}
      windows: ${{ inputs.windows || '1' }}
